services:
  mssql:
    image: mcr.azure.cn/mssql/server:2025-latest
    container_name: home-library-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_Strong_Pass123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: homelibrary:0.16
    container_name: home-library-api
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ""
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=HomeLibrary;User Id=sa;Password=Your_Strong_Pass123;TrustServerCertificate=True;Encrypt=False"
    ports:
      - "8085:8080"
